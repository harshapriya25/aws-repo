
name: Artifact Demo

on:
  push:
    branches: [main]

jobs:
  upload-job:
    runs-on: ubuntu-latest

    steps:
      - name: Create text file
        run: |
          echo "Hello from Upload Job!" > message.txt
          echo "This file is shared using artifacts." >> message.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-text-file
          path: message.txt

  download-job:
    runs-on: ubuntu-latest
    needs: upload-job

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: my-text-file

      - name: Read and print text file
        run: |
          echo "Text file content:"
          cat message.txt
